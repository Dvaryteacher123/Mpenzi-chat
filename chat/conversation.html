    <!-- ==========================================
    JAVASCRIPT - Imeunganishwa na Firebase
    ========================================== -->
    <script type="module">
        // ==========================================
        // IMPORT FIREBASE SDKs
        // ==========================================
        import { initializeApp } from "firebase/app";
        import { getAnalytics } from "firebase/analytics";
        import { 
            getAuth, 
            onAuthStateChanged 
        } from "firebase/auth";
        import { 
            getFirestore, 
            doc, 
            getDoc,
            setDoc,
            updateDoc,
            deleteDoc,
            collection,
            query,
            where,
            orderBy,
            onSnapshot,
            addDoc,
            serverTimestamp,
            arrayUnion,
            arrayRemove,
            increment
        } from "firebase/firestore";
        import { 
            getStorage,
            ref,
            uploadBytes,
            uploadBytesResumable,
            getDownloadURL,
            deleteObject
        } from "firebase/storage";
        
        // ==========================================
        // FIREBASE CONFIGURATION
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyCmwASW4XXQ3O0AvsCM_r1WLlrUmGjYVxI",
            authDomain: "dvary-9a7d0.firebaseapp.com",
            projectId: "dvary-9a7d0",
            storageBucket: "dvary-9a7d0.firebasestorage.app",
            messagingSenderId: "107370806066",
            appId: "1:107370806066:web:4c2ce1e6f7b6c32909f52b",
            measurementId: "G-07361LFJEP"
        };
        
        // ==========================================
        // INITIALIZE FIREBASE
        // ==========================================
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);
        
        // ==========================================
        // DOM ELEMENTS
        // ==========================================
        const backBtn = document.getElementById('backBtn');
        const chatAvatarImg = document.getElementById('chatAvatarImg');
        const chatAvatarText = document.getElementById('chatAvatarText');
        const chatUserName = document.getElementById('chatUserName');
        const chatUserStatus = document.getElementById('chatUserStatus');
        const messagesList = document.getElementById('messagesList');
        const messageText = document.getElementById('messageText');
        const sendBtn = document.getElementById('sendBtn');
        const emojiBtn = document.getElementById('emojiBtn');
        const emojiPicker = document.getElementById('emojiPicker');
        const attachBtn = document.getElementById('attachBtn');
        const attachMenu = document.getElementById('attachMenu');
        const fileInput = document.getElementById('fileInput');
        const cameraInput = document.getElementById('cameraInput');
        const voiceBtn = document.getElementById('voiceBtn');
        const callBtn = document.getElementById('callBtn');
        const videoBtn = document.getElementById('videoBtn');
        const moreBtn = document.getElementById('moreBtn');
        const messagesContainer = document.getElementById('messagesContainer');
        
        // ==========================================
        // STATE
        // ==========================================
        let currentUser = null;
        let userData = null;
        let otherUser = null;
        let conversationId = null;
        let conversationData = null;
        let messages = [];
        let unsubscribeMessages = null;
        let isTyping = false;
        let typingTimeout = null;
        let unsubscribeTyping = null;
        
        // Get conversation ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const conversationIdParam = urlParams.get('id');
        
        // ==========================================
        // CHECK AUTHENTICATION
        // ==========================================
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = '../login.html';
                return;
            }
            
            currentUser = user;
            await loadUserData(user.uid);
            
            if (conversationIdParam) {
                conversationId = conversationIdParam;
                await loadConversation(conversationId);
                loadMessages(conversationId);
                listenTyping(conversationId);
            } else {
                // No conversation ID - redirect to chat
                window.location.href = '../chat.html';
            }
        });
        
        // ==========================================
        // LOAD USER DATA
        // ==========================================
        async function loadUserData(uid) {
            try {
                const userDoc = await getDoc(doc(db, 'users', uid));
                if (userDoc.exists()) {
                    userData = userDoc.data();
                    return userData;
                }
            } catch (error) {
                console.error('Error loading user data:', error);
            }
            return null;
        }
        
        // ==========================================
        // LOAD CONVERSATION
        // ==========================================
        async function loadConversation(convId) {
            try {
                const convDoc = await getDoc(doc(db, 'conversations', convId));
                if (!convDoc.exists()) {
                    showError('Mazungumzo hayapatikani');
                    return;
                }
                
                conversationData = convDoc.data();
                
                // Get other participant
                const otherUserId = conversationData.participants.find(id => id !== currentUser.uid);
                await loadOtherUser(otherUserId);
                
                // Update header
                updateHeader();
                
                // Mark messages as read
                await markMessagesAsRead(convId);
                
            } catch (error) {
                console.error('Error loading conversation:', error);
                showError('Imeshindwa kupakia mazungumzo');
            }
        }
        
        // ==========================================
        // LOAD OTHER USER
        // ==========================================
        async function loadOtherUser(userId) {
            try {
                const userDoc = await getDoc(doc(db, 'users', userId));
                if (userDoc.exists()) {
                    otherUser = {
                        id: userId,
                        ...userDoc.data()
                    };
                    
                    // Listen to online status
                    listenUserStatus(userId);
                }
            } catch (error) {
                console.error('Error loading other user:', error);
            }
        }
        
        // ==========================================
        // LISTEN USER STATUS (Real-time)
        // ==========================================
        function listenUserStatus(userId) {
            const unsubscribe = onSnapshot(doc(db, 'users', userId), (doc) => {
                if (doc.exists()) {
                    const data = doc.data();
                    if (otherUser) {
                        otherUser.onlineStatus = data.onlineStatus;
                        otherUser.lastSeen = data.lastSeen;
                        updateHeader();
                    }
                }
            });
            
            // Store unsubscribe for cleanup
            window.unsubscribeStatus = unsubscribe;
        }
        
        // ==========================================
        // UPDATE HEADER
        // ==========================================
        function updateHeader() {
            if (!otherUser) return;
            
            const name = otherUser.fullName || 'Mtumiaji';
            chatUserName.textContent = name;
            
            // Avatar
            if (otherUser.profilePhoto) {
                chatAvatarImg.src = otherUser.profilePhoto;
                chatAvatarImg.style.display = 'block';
                chatAvatarText.style.display = 'none';
            } else {
                chatAvatarImg.style.display = 'none';
                chatAvatarText.style.display = 'flex';
                chatAvatarText.textContent = name[0].toUpperCase();
            }
            
            // Status
            if (otherUser.onlineStatus) {
                chatUserStatus.textContent = '🟢 Online';
                chatUserStatus.className = 'status online';
            } else {
                const lastSeen = otherUser.lastSeen ? new Date(otherUser.lastSeen) : new Date();
                const now = new Date();
                const diff = now - lastSeen;
                
                if (diff < 60000) {
                    chatUserStatus.textContent = '⚪ Alionekana dakika iliyopita';
                } else if (diff < 3600000) {
                    chatUserStatus.textContent = `⚪ Alionekana ${Math.floor(diff / 60000)} dakika iliyopita`;
                } else if (diff < 86400000) {
                    chatUserStatus.textContent = `⚪ Alionekana ${Math.floor(diff / 3600000)} saa iliyopita`;
                } else {
                    chatUserStatus.textContent = `⚪ Alionekana ${lastSeen.toLocaleDateString()}`;
                }
                chatUserStatus.className = 'status offline';
            }
        }
        
        // ==========================================
        // LOAD MESSAGES (Real-time)
        // ==========================================
        function loadMessages(convId) {
            if (unsubscribeMessages) {
                unsubscribeMessages();
            }
            
            const q = query(
                collection(db, 'conversations', convId, 'messages'),
                orderBy('createdAt', 'asc')
            );
            
            unsubscribeMessages = onSnapshot(q, (snapshot) => {
                messages = [];
                
                if (snapshot.empty) {
                    showEmptyMessages();
                    return;
                }
                
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    messages.push({
                        id: doc.id,
                        ...data
                    });
                });
                
                renderMessages();
                scrollToBottom();
            }, (error) => {
                console.error('Error loading messages:', error);
            });
        }
        
        // ==========================================
        // RENDER MESSAGES
        // ==========================================
        function renderMessages() {
            if (!messagesList) return;
            
            if (messages.length === 0) {
                showEmptyMessages();
                return;
            }
            
            let html = '';
            let lastDate = null;
            
            messages.forEach((message) => {
                const messageDate = message.createdAt?.toDate?.() || new Date(message.createdAt);
                const dateStr = messageDate.toDateString();
                
                // Add date separator
                if (dateStr !== lastDate) {
                    html += `
                        <div class="date-separator">
                            <span>${formatDate(messageDate)}</span>
                        </div>
                    `;
                    lastDate = dateStr;
                }
                
                const isSent = message.senderId === currentUser.uid;
                const messageClass = isSent ? 'sent' : 'received';
                const statusIcon = getMessageStatus(message);
                
                html += `
                    <div class="message ${messageClass}" id="msg-${message.id}">
                        ${renderMessageContent(message)}
                        <span class="time">
                            ${formatTime(messageDate)}
                            ${statusIcon}
                        </span>
                    </div>
                `;
            });
            
            messagesList.innerHTML = html;
        }
        
        // ==========================================
        // RENDER MESSAGE CONTENT
        // ==========================================
        function renderMessageContent(message) {
            const type = message.type || 'text';
            
            switch (type) {
                case 'text':
                    return `<div class="text">${escapeHtml(message.content)}</div>`;
                    
                case 'image':
                    return `
                        <img src="${message.content}" class="message-image" alt="Image" 
                             onclick="window.open('${message.content}')" />
                    `;
                    
                case 'video':
                    return `
                        <video src="${message.content}" class="message-video" controls 
                               onclick="this.paused ? this.play() : this.pause()"></video>
                    `;
                    
                case 'audio':
                    return `
                        <audio src="${message.content}" class="message-audio" controls></audio>
                    `;
                    
                case 'document':
                    const fileName = message.fileName || 'Document';
                    const fileSize = message.fileSize || 0;
                    return `
                        <div class="message-document">
                            <span class="doc-icon">📄</span>
                            <div class="doc-info">
                                <div class="doc-name">${escapeHtml(fileName)}</div>
                                <div class="doc-size">${formatFileSize(fileSize)}</div>
                            </div>
                            <button class="doc-download" onclick="window.open('${message.content}')">
                                ⬇️
                            </button>
                        </div>
                    `;
                    
                default:
                    return `<div class="text">${escapeHtml(message.content || '')}</div>`;
            }
        }
        
        // ==========================================
        // GET MESSAGE STATUS
        // ==========================================
        function getMessageStatus(message) {
            const isSent = message.senderId === currentUser.uid;
            if (!isSent) return '';
            
            if (message.readAt) {
                return ' <span class="status-icon" title="Imesomwa">✅</span>';
            } else if (message.deliveredAt) {
                return ' <span class="status-icon" title="Imefika">✓✓</span>';
            } else {
                return ' <span class="status-icon" title="Imetumwa">✓</span>';
            }
        }
        
        // ==========================================
        // SHOW EMPTY MESSAGES
        // ==========================================
        function showEmptyMessages() {
            messagesList.innerHTML = `
                <div class="empty-messages">
                    <div class="empty-icon">💬</div>
                    <h4>Hakuna ujumbe</h4>
                    <p>Anza mazungumzo na ${otherUser?.fullName || 'mtumiaji'}</p>
                </div>
            `;
        }
        
        // ==========================================
        // SEND MESSAGE
        // ==========================================
        async function sendMessage() {
            const content = messageText.value.trim();
            if (!content && !fileInput.files.length) return;
            
            // Show loading state
            sendBtn.disabled = true;
            sendBtn.textContent = '⏳';
            
            try {
                let messageData = {
                    senderId: currentUser.uid,
                    conversationId: conversationId,
                    type: 'text',
                    content: content,
                    createdAt: serverTimestamp(),
                    deliveredAt: null,
                    readAt: null,
                    deleted: false
                };
                
                // Handle file upload if any
                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    const fileType = file.type;
                    
                    if (fileType.startsWith('image/')) {
                        messageData.type = 'image';
                        messageData.content = await uploadFile(file, 'images');
                    } else if (fileType.startsWith('video/')) {
                        messageData.type = 'video';
                        messageData.content = await uploadFile(file, 'videos');
                    } else if (fileType.startsWith('audio/')) {
                        messageData.type = 'audio';
                        messageData.content = await uploadFile(file, 'audio');
                    } else {
                        messageData.type = 'document';
                        messageData.content = await uploadFile(file, 'documents');
                        messageData.fileName = file.name;
                        messageData.fileSize = file.size;
                    }
                    
                    // Clear file input
                    fileInput.value = '';
                }
                
                // Add message to Firestore
                const docRef = await addDoc(
                    collection(db, 'conversations', conversationId, 'messages'),
                    messageData
                );
                
                // Update conversation
                await updateDoc(doc(db, 'conversations', conversationId), {
                    lastMessage: messageData.type === 'text' ? messageData.content : `[${messageData.type}]`,
                    lastMessageTime: serverTimestamp(),
                    updatedAt: serverTimestamp(),
                    [`unreadCount.${otherUser.id}`]: increment(1)
                });
                
                // Clear input
                messageText.value = '';
                messageText.style.height = 'auto';
                sendBtn.disabled = false;
                sendBtn.textContent = '➤';
                
                // Scroll to bottom
                scrollToBottom();
                
            } catch (error) {
                console.error('Error sending message:', error);
                showError('Imeshindwa kutuma ujumbe');
                sendBtn.disabled = false;
                sendBtn.textContent = '➤';
            }
        }
        
        // ==========================================
        // UPLOAD FILE
        // ==========================================
        async function uploadFile(file, folder) {
            try {
                const fileName = `${Date.now()}_${file.name}`;
                const storageRef = ref(storage, `chat-${folder}/${conversationId}/${fileName}`);
                
                // Show upload progress
                const uploadTask = uploadBytesResumable(storageRef, file);
                
                return new Promise((resolve, reject) => {
                    uploadTask.on(
                        'state_changed',
                        (snapshot) => {
                            const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                            console.log(`Upload progress: ${progress}%`);
                        },
                        (error) => {
                            reject(error);
                        },
                        async () => {
                            const downloadURL = await getDownloadURL(uploadTask.snapshot.ref);
                            resolve(downloadURL);
                        }
                    );
                });
            } catch (error) {
                console.error('Upload error:', error);
                throw error;
            }
        }
        
        // ==========================================
        // MARK MESSAGES AS READ
        // ==========================================
        async function markMessagesAsRead(convId) {
            try {
                const q = query(
                    collection(db, 'conversations', convId, 'messages'),
                    where('senderId', '==', otherUser?.id || ''),
                    where('readAt', '==', null)
                );
                
                const snapshot = await getDocs(q);
                const batch = [];
                
                snapshot.forEach((doc) => {
                    batch.push(updateDoc(doc.ref, {
                        readAt: new Date().toISOString()
                    }));
                });
                
                await Promise.all(batch);
                
                // Reset unread count
                await updateDoc(doc(db, 'conversations', convId), {
                    [`unreadCount.${currentUser.uid}`]: 0
                });
                
            } catch (error) {
                console.error('Error marking messages as read:', error);
            }
        }
        
        // ==========================================
        // LISTEN TYPING (Real-time)
        // ==========================================
        function listenTyping(convId) {
            if (unsubscribeTyping) {
                unsubscribeTyping();
            }
            
            const typingRef = doc(db, 'conversations', convId, 'typing', currentUser.uid);
            
            // Listen for other user's typing status
            const otherTypingRef = doc(db, 'conversations', convId, 'typing', otherUser?.id || '');
            unsubscribeTyping = onSnapshot(otherTypingRef, (doc) => {
                if (doc.exists() && doc.data().isTyping) {
                    chatUserStatus.textContent = '✏️ Anaandika...';
                } else {
                    updateHeader();
                }
            });
        }
        
        // ==========================================
        // HANDLE TYPING
        // ==========================================
        function handleTyping() {
            const typingRef = doc(db, 'conversations', conversationId, 'typing', currentUser.uid);
            
            if (!isTyping) {
                isTyping = true;
                setDoc(typingRef, {
                    isTyping: true,
                    updatedAt: serverTimestamp()
                });
            }
            
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                isTyping = false;
                setDoc(typingRef, {
                    isTyping: false,
                    updatedAt: serverTimestamp()
                });
            }, 3000);
        }
        
        // ==========================================
        // SCROLL TO BOTTOM
        // ==========================================
        function scrollToBottom() {
            setTimeout(() => {
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }, 100);
        }
        
        // ==========================================
        // HELPER FUNCTIONS
        // ==========================================
        function formatDate(date) {
            const today = new Date();
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);
            
            if (date.toDateString() === today.toDateString()) {
                return 'Leo';
            } else if (date.toDateString() === yesterday.toDateString()) {
                return 'Jana';
            } else {
                return date.toLocaleDateString('sw', { 
                    weekday: 'long', 
                    day: 'numeric', 
                    month: 'long',
                    year: 'numeric'
                });
            }
        }
        
        function formatTime(date) {
            return date.toLocaleTimeString('sw', { 
                hour: '2-digit', 
                minute: '2-digit' 
            });
        }
        
        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            if (bytes < 1073741824) return (bytes / 1048576).toFixed(1) + ' MB';
            return (bytes / 1073741824).toFixed(1) + ' GB';
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function showError(message) {
            alert(message);
        }
        
        // ==========================================
        // EVENT LISTENERS
        // ==========================================
        
        // Back button
        backBtn.addEventListener('click', () => {
            window.location.href = '../chat.html';
        });
        
        // Send message
        sendBtn.addEventListener('click', sendMessage);
        
        // Enter to send
        messageText.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        
        // Auto-resize textarea
        messageText.addEventListener('input', () => {
            messageText.style.height = 'auto';
            messageText.style.height = messageText.scrollHeight + 'px';
            
            if (messageText.value.trim()) {
                sendBtn.style.display = 'flex';
                voiceBtn.style.display = 'none';
                handleTyping();
            } else {
                sendBtn.style.display = 'none';
                voiceBtn.style.display = 'flex';
            }
        });
        
        // Emoji picker
        emojiBtn.addEventListener('click', () => {
            emojiPicker.style.display = emojiPicker.style.display === 'none' ? 'block' : 'none';
            attachMenu.style.display = 'none';
        });
        
        // Emoji selection
        document.querySelectorAll('.emoji').forEach((emoji) => {
            emoji.addEventListener('click', () => {
                messageText.value += emoji.textContent;
                messageText.dispatchEvent(new Event('input'));
                emojiPicker.style.display = 'none';
                messageText.focus();
            });
        });
        
        // Attachment menu
        attachBtn.addEventListener('click', () => {
            attachMenu.style.display = attachMenu.style.display === 'none' ? 'block' : 'none';
            emojiPicker.style.display = 'none';
        });
        
        // Attachment options
        document.querySelectorAll('.attach-option').forEach((option) => {
            option.addEventListener('click', () => {
                const type = option.dataset.type;
                
                switch (type) {
                    case 'image':
                        fileInput.accept = 'image/*';
                        fileInput.click();
                        break;
                    case 'camera':
                        cameraInput.click();
                        break;
                    case 'video':
                        fileInput.accept = 'video/*';
                        fileInput.click();
                        break;
                    case 'audio':
                        fileInput.accept = 'audio/*';
                        fileInput.click();
                        break;
                    case 'document':
                        fileInput.accept = 'application/*,.pdf,.doc,.docx,.xls,.xlsx,.txt';
                        fileInput.click();
                        break;
                }
                
                attachMenu.style.display = 'none';
            });
        });
        
        // File input change
        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) {
                // Show file name in input
                const fileName = fileInput.files[0].name;
                messageText.value = `📎 ${fileName}`;
                messageText.dispatchEvent(new Event('input'));
                sendMessage();
            }
        });
        
        // Camera input
        cameraInput.addEventListener('change', () => {
            if (cameraInput.files.length > 0) {
                sendMessage();
            }
        });
        
        // Voice button (placeholder)
        voiceBtn.addEventListener('click', () => {
            alert('🎤 Feature ya sauti itakuja hivi karibuni!');
        });
        
        // Call buttons (placeholder)
        callBtn.addEventListener('click', () => {
            alert('📞 Feature ya simu itakuja hivi karibuni!');
        });
        
        videoBtn.addEventListener('click', () => {
            alert('📹 Feature ya video itakuja hivi karibuni!');
        });
        
        moreBtn.addEventListener('click', () => {
            alert('⋮ Chaguzi zaidi: Reply, Forward, Delete, Star, Report');
        });
        
        // Close menus on outside click
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.emoji-picker') && !e.target.closest('#emojiBtn')) {
                emojiPicker.style.display = 'none';
            }
            if (!e.target.closest('.attach-menu') && !e.target.closest('#attachBtn')) {
                attachMenu.style.display = 'none';
            }
        });
        
        // ==========================================
        // KEYBOARD SHORTCUTS
        // ==========================================
        document.addEventListener('keydown', (e) => {
            // Escape to close menus
            if (e.key === 'Escape') {
                emojiPicker.style.display = 'none';
                attachMenu.style.display = 'none';
            }
        });
        
        // ==========================================
        // CLEANUP
        // ==========================================
        window.addEventListener('beforeunload', () => {
            if (unsubscribeMessages) unsubscribeMessages();
            if (unsubscribeTyping) unsubscribeTyping();
            if (window.unsubscribeStatus) window.unsubscribeStatus();
        });
        
        // ==========================================
        // INIT
        // ==========================================
        console.log('✅ Conversation page loaded successfully');
        console.log('🔥 Firebase initialized with config:', firebaseConfig);
        console.log('📱 Conversation ID:', conversationIdParam);
    </script>
</body>
  </html>
