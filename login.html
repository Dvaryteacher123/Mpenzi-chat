<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Ingia - TAFUTA MPENZI</title>
    
    <!-- CSS Files -->
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/themes.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    
    <!-- Firebase Import Map -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"
            }
        }
    </script>
</head>
<body>
    <!-- ==========================================
    MAIN CONTAINER
    ========================================== -->
    <div class="auth-container">
        <div class="auth-card animate-slide-up">
            <!-- Logo -->
            <div class="auth-logo">
                <div class="logo-icon">❤️</div>
                <h1>TAFUTA MPENZI</h1>
                <p class="auth-subtitle">Karibu tena! Ingia kwenye akaunti yako</p>
            </div>
            
            <!-- ==========================================
            LOGIN FORM
            ========================================== -->
            <form id="loginForm" class="auth-form">
                <!-- Email/Username/Phone -->
                <div class="input-group">
                    <label for="identifier">
                        Barua pepe, Jina la mtumiaji au Nambari ya simu
                        <span class="required">*</span>
                    </label>
                    <div class="input-with-icon">
                        <span class="icon">📧</span>
                        <input 
                            type="text" 
                            id="identifier" 
                            placeholder="Enter email, username or phone"
                            required
                            autocomplete="username"
                        />
                    </div>
                    <div class="input-error" id="identifierError"></div>
                </div>
                
                <!-- Password -->
                <div class="input-group">
                    <label for="password">
                        Nenosiri
                        <span class="required">*</span>
                    </label>
                    <div class="input-with-icon">
                        <span class="icon">🔒</span>
                        <input 
                            type="password" 
                            id="password" 
                            placeholder="Enter your password"
                            required
                            autocomplete="current-password"
                            minlength="6"
                        />
                        <button type="button" class="toggle-password" id="togglePassword">
                            👁️
                        </button>
                    </div>
                    <div class="input-error" id="passwordError"></div>
                </div>
                
                <!-- Remember Me & Forgot Password -->
                <div class="auth-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe" checked />
                        <span>Nikumbuke</span>
                    </label>
                    <a href="auth/forgot-password.html" class="forgot-link">
                        Nimesahau nenosiri?
                    </a>
                </div>
                
                <!-- Login Button -->
                <button type="submit" class="btn btn-primary btn-block btn-lg" id="loginBtn">
                    <span id="loginText">Ingia</span>
                    <span id="loginSpinner" class="spinner" style="display:none;"></span>
                </button>
                
                <!-- Divider -->
                <div class="auth-divider">
                    <span>au</span>
                </div>
                
                <!-- Signup Link -->
                <div class="auth-footer">
                    <p>Huna akaunti? <a href="signup.html" class="auth-link">Jisajili sasa</a></p>
                </div>
            </form>
            
            <!-- ==========================================
            ERROR/Success MESSAGES
            ========================================== -->
            <div id="messageContainer" style="display:none;" class="message-container">
                <div id="messageText" class="message-text"></div>
            </div>
            
            <!-- ==========================================
            FOOTER
            ========================================== -->
            <div class="auth-footer-links">
                <button onclick="location.href='settings/language.html'" class="footer-link">
                    🌐 Language
                </button>
                <span class="dot">•</span>
                <button onclick="location.href='settings/themes.html'" class="footer-link">
                    🎨 Theme
                </button>
                <span class="dot">•</span>
                <button onclick="location.href='settings/help.html'" class="footer-link">
                    ❓ Help
                </button>
            </div>
            
            <p class="auth-version">v1.0.0</p>
        </div>
    </div>
    
    <!-- ==========================================
    JAVASCRIPT
    ========================================== -->
    <script type="module">
        // ==========================================
        // IMPORT FIREBASE
        // ==========================================
        import { initializeApp } from "firebase/app";
        import { 
            getAuth, 
            signInWithEmailAndPassword,
            signInWithEmailAndPassword,
            onAuthStateChanged,
            setPersistence,
            browserLocalPersistence,
            browserSessionPersistence
        } from "firebase/auth";
        import { 
            getFirestore, 
            doc, 
            getDoc, 
            updateDoc 
        } from "firebase/firestore";
        
        // ==========================================
        // FIREBASE CONFIG
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyCmwASW4XXQ3O0AvsCM_r1WLlrUmGjYVxI",
            authDomain: "dvary-9a7d0.firebaseapp.com",
            projectId: "dvary-9a7d0",
            storageBucket: "dvary-9a7d0.firebasestorage.app",
            messagingSenderId: "107370806066",
            appId: "1:107370806066:web:4c2ce1e6f7b6c32909f52b",
            measurementId: "G-07361LFJEP"
        };
        
        // ==========================================
        // INITIALIZE FIREBASE
        // ==========================================
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // ==========================================
        // DOM ELEMENTS
        // ==========================================
        const form = document.getElementById('loginForm');
        const identifier = document.getElementById('identifier');
        const password = document.getElementById('password');
        const rememberMe = document.getElementById('rememberMe');
        const loginBtn = document.getElementById('loginBtn');
        const loginText = document.getElementById('loginText');
        const loginSpinner = document.getElementById('loginSpinner');
        const togglePassword = document.getElementById('togglePassword');
        const messageContainer = document.getElementById('messageContainer');
        const messageText = document.getElementById('messageText');
        const identifierError = document.getElementById('identifierError');
        const passwordError = document.getElementById('passwordError');
        
        // ==========================================
        // CHECK IF ALREADY LOGGED IN
        // ==========================================
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Already logged in - redirect to chat
                window.location.href = 'chat.html';
            }
        });
        
        // ==========================================
        // TOGGLE PASSWORD VISIBILITY
        // ==========================================
        togglePassword.addEventListener('click', () => {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            togglePassword.textContent = type === 'password' ? '👁️' : '👁️‍🗨️';
        });
        
        // ==========================================
        // SHOW ERROR MESSAGE
        // ==========================================
        function showError(message) {
            messageContainer.style.display = 'block';
            messageContainer.className = 'message-container error';
            messageText.textContent = message;
            
            // Auto-hide after 5 seconds
            setTimeout(() => {
                messageContainer.style.display = 'none';
            }, 5000);
        }
        
        // ==========================================
        // SHOW SUCCESS MESSAGE
        // ==========================================
        function showSuccess(message) {
            messageContainer.style.display = 'block';
            messageContainer.className = 'message-container success';
            messageText.textContent = message;
        }
        
        // ==========================================
        // CLEAR ERRORS
        // ==========================================
        function clearErrors() {
            identifierError.textContent = '';
            identifierError.classList.remove('visible');
            identifier.classList.remove('error');
            passwordError.textContent = '';
            passwordError.classList.remove('visible');
            password.classList.remove('error');
            messageContainer.style.display = 'none';
        }
        
        // ==========================================
        // VALIDATE FORM
        // ==========================================
        function validateForm() {
            let isValid = true;
            clearErrors();
            
            // Validate identifier
            if (!identifier.value.trim()) {
                identifierError.textContent = 'Tafadhali ingiza barua pepe, jina la mtumiaji au nambari ya simu';
                identifierError.classList.add('visible');
                identifier.classList.add('error');
                isValid = false;
            }
            
            // Validate password
            if (!password.value) {
                passwordError.textContent = 'Tafadhali ingiza nenosiri lako';
                passwordError.classList.add('visible');
                password.classList.add('error');
                isValid = false;
            } else if (password.value.length < 6) {
                passwordError.textContent = 'Nenosiri lazima liwe na angalau herufi 6';
                passwordError.classList.add('visible');
                password.classList.add('error');
                isValid = false;
            }
            
            return isValid;
        }
        
        // ==========================================
        // SET PERSISTENCE
        // ==========================================
        async function setAuthPersistence() {
            try {
                if (rememberMe.checked) {
                    await setPersistence(auth, browserLocalPersistence);
                } else {
                    await setPersistence(auth, browserSessionPersistence);
                }
                return true;
            } catch (error) {
                console.error('Persistence error:', error);
                return false;
            }
        }
        
        // ==========================================
        // HANDLE LOGIN
        // ==========================================
        async function handleLogin(e) {
            e.preventDefault();
            
            // Validate form
            if (!validateForm()) {
                return;
            }
            
            // Show loading state
            loginBtn.disabled = true;
            loginText.textContent = 'Inaingiza...';
            loginSpinner.style.display = 'inline-block';
            
            try {
                // Set persistence
                await setAuthPersistence();
                
                // Try to login with email
                let userCredential;
                const identifierValue = identifier.value.trim();
                const passwordValue = password.value;
                
                // Check if identifier is email
                if (identifierValue.includes('@') && identifierValue.includes('.')) {
                    // Login with email
                    userCredential = await signInWithEmailAndPassword(
                        auth, 
                        identifierValue, 
                        passwordValue
                    );
                } else {
                    // Try to find user by username or phone
                    // For now, we'll try email login with a constructed email
                    // In production, you'd query Firestore for username/phone
                    
                    // Since Firebase Auth only supports email/password,
                    // we'll try to find the user's email from Firestore
                    // This is a simplified approach
                    
                    // Query users collection for username or phone
                    // For now, we'll show error that username/phone login
                    // requires additional implementation
                    
                    // Temporary: Try as email if it looks like email
                    if (identifierValue.includes('@')) {
                        userCredential = await signInWithEmailAndPassword(
                            auth, 
                            identifierValue, 
                            passwordValue
                        );
                    } else {
                        // For demo, try to find user in Firestore
                        // In production, implement proper username/phone login
                        throw new Error('Tafadhali ingiza barua pepe yako');
                    }
                }
                
                // Login successful
                const user = userCredential.user;
                
                // Update user online status
                await updateDoc(doc(db, 'users', user.uid), {
                    onlineStatus: true,
                    lastSeen: new Date().toISOString()
                });
                
                // Show success
                showSuccess('Ingia kwenye akaunti yako!');
                
                // Redirect to chat after short delay
                setTimeout(() => {
                    window.location.href = 'chat.html';
                }, 1000);
                
            } catch (error) {
                console.error('Login error:', error);
                
                // Handle specific Firebase errors
                let errorMessage = 'Imeshindwa kuingia. Tafadhali jaribu tena.';
                
                switch (error.code) {
                    case 'auth/user-not-found':
                        errorMessage = 'Hakuna akaunti iliyopatikana kwa barua pepe hii.';
                        break;
                    case 'auth/wrong-password':
                        errorMessage = 'Nenosiri si sahihi. Tafadhali jaribu tena.';
                        break;
                    case 'auth/invalid-email':
                        errorMessage = 'Barua pepe si sahihi. Tafadhali ingiza barua pepe halali.';
                        break;
                    case 'auth/user-disabled':
                        errorMessage = 'Akaunti yako imezimwa. Tafadhali wasiliana na msaada.';
                        break;
                    case 'auth/too-many-requests':
                        errorMessage = 'Majaribio mengi sana. Tafadhali jaribu tena baadaye.';
                        break;
                    case 'auth/network-request-failed':
                        errorMessage = 'Tatizo la mtandao. Tafadhali hakikisha umeunganishwa kwenye intaneti.';
                        break;
                    default:
                        errorMessage = error.message || 'Imeshindwa kuingia. Tafadhali jaribu tena.';
                }
                
                showError(errorMessage);
                
                // Re-enable button
                loginBtn.disabled = false;
                loginText.textContent = 'Ingia';
                loginSpinner.style.display = 'none';
            }
        }
        
        // ==========================================
        // EVENT LISTENERS
        // ==========================================
        form.addEventListener('submit', handleLogin);
        
        // Real-time validation on input
        identifier.addEventListener('input', () => {
            if (identifier.value.trim()) {
                identifierError.classList.remove('visible');
                identifier.classList.remove('error');
            }
        });
        
        password.addEventListener('input', () => {
            if (password.value.length >= 6) {
                passwordError.classList.remove('visible');
                password.classList.remove('error');
            } else if (password.value.length > 0) {
                passwordError.textContent = 'Nenosiri lazima liwe na angalau herufi 6';
                passwordError.classList.add('visible');
                password.classList.add('error');
            } else {
                passwordError.classList.remove('visible');
                password.classList.remove('error');
            }
        });
        
        // ==========================================
        // KEYBOARD SHORTCUTS
        // ==========================================
        document.addEventListener('keydown', (e) => {
            // Ctrl+Enter to submit
            if (e.ctrlKey && e.key === 'Enter') {
                form.dispatchEvent(new Event('submit'));
            }
        });
        
        // ==========================================
        // AUTO-FILL DETECTION
        // ==========================================
        // Handle browser auto-fill
        document.addEventListener('change', () => {
            if (identifier.value && password.value) {
                // Auto-fill detected, clear any errors
                clearErrors();
            }
        });
        
        // ==========================================
        // LOAD SAVED IDENTIFIER
        // ==========================================
        const savedIdentifier = localStorage.getItem('tafuta-identifier');
        if (savedIdentifier) {
            identifier.value = savedIdentifier;
            rememberMe.checked = true;
        }
        
        console.log('✅ Login page loaded successfully');
    </script>
</body>
</html>
